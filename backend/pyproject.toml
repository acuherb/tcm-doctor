[project]
name = "tcm-doctor-backend"
version = "0.1.0"
description = "中医诊所问诊管理平台后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.110.3",
    "uvicorn==0.30.6",
    "sqlalchemy==2.0.36",
    "alembic==1.13.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
ai = [
    "chromadb>=0.4",
    "sentence-transformers",
    "openai>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"